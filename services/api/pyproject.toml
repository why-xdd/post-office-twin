[project]
name = "ops-twin-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "shapely>=2.0",
    "networkx>=3.3",
    # Импорт чертежа: растр картинки и страниц PDF. Лицензии MIT-HPND и Apache-2.0.
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.20",
    # Хранилище на PostgreSQL для развёртывания. Лицензия BSD-3-Clause.
    "pg8000>=1.31",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
